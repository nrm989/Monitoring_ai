services:
  exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    container_name: websites-exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SCRAPE_INTERVAL: "30"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Alertes mail via Gmail (identifiants lus depuis .env : SMTP_USER / SMTP_PASS / MAIL_TO)
      # Port 587 + STARTTLS (le port 465 de .env reste utilisé par report.py uniquement)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${SMTP_USER}"
      GF_SMTP_PASSWORD: "${SMTP_PASS}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_USER}"
      GF_SMTP_FROM_NAME: "Monitoring MMSP"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      # Destinataire des alertes (utilisé par le provisioning $MAIL_TO)
      MAIL_TO: "${MAIL_TO}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prom_data:
  grafana_data:

name: daily-monitor
on:
  schedule:
    - cron: "0 7 * * *"   # 08h Maroc (UTC+1)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt requests pyyaml
      - run: python monitor.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: history
          path: data/
      - name: Email report
        if: always()
        run: python report.py --to snajnihal2002@gmail.com
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
